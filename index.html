<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Antique coin clicker</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script defer src="counter.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="sidebar">
            <h2 class="center">Upgrades</h2>
            <button id="older-coin-upgrade" class="upgrade">
                <h3 class="upgrade-title">Older Coin 1</h3>
                <p class="upgrade-description">Make your coin older and therefore more valuble.</p>
                <p class="upgrade-cost">10 coins</p>
            </button>
            <button id="auto-clicker-upgrade" class="upgrade">
                <h3 class="upgrade-title">Goblin 1</h3>
                <p class="upgrade-description">Hire Goblins to click the coin for you.</p>
                <p class="upgrade-cost">1000 coins</p>
            </button>
            <button class="upgrade">upgrade 3</button>
        </div>
        <div class="content">
            <div class="background center">
                <h1>Welcome to Antique coin clicker</h1>
                <img id="coin" class="center" src="images/coin0.png" alt="coin to click.">
                <p id="coin-number-text">You have <span id="coin-number">0</span>🪙s.</p>
            </div>
            
        
            <footer class="background center">
                <h2>Credits:</h2>
                <ul>
                    <li>https://imgbin.com</li>
                    <li>https://picryl.com/media/paper-old-texture-backgrounds-textures-7947da</li>
                    <li>pngtree</li>
                    <li>wikipeida commons</li>
                    <li>vecteezy</li>
                    <li>dreamstime</li>
                </ul>
            </footer>
        </div>
    </body>
</html>
